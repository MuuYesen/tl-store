name: Release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish source-qualified wheels to PyPI
        required: true
        default: false
        type: boolean
      qualified_run_id:
        description: Successful exact-main CI run whose source-qualified wheels are reused
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: tl-store-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify-distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Require successful exact-SHA private-main CI
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFIED_RUN_ID: ${{ inputs.qualified_run_id }}
        run: |
          python - <<'PY'
          import os
          assert os.environ['QUALIFIED_RUN_ID'].isdigit(), 'numeric qualified CI run ID required'
          PY
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${QUALIFIED_RUN_ID}" > qualified-run.json
          python tools/check_release.py --qualified-run qualified-run.json --sha "$GITHUB_SHA"
      - uses: actions/download-artifact@v4
        with:
          pattern: ctrader-cp313-*-release
          path: incoming
          github-token: ${{ github.token }}
          run-id: ${{ inputs.qualified_run_id }}
      - name: Select exact two platform wheels; keep standalone source artifacts private
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          wheels = sorted(Path('incoming').rglob('*.whl'))
          assert len(wheels) == 2, wheels
          assert len({p.name for p in wheels}) == 2
          Path('dist').mkdir()
          for path in wheels:
              assert path.name.startswith('tl_store-0.2.1a3-cp313-cp313-'), path
              shutil.copy2(path, Path('dist') / path.name)
          PY
      - name: Require exact recipient corresponding source, vendor and RECORD
        run: python tools/check_release.py --wheel dist/*.whl
      - run: python -m pip install twine
      - run: python -m twine check dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: qualified-pypi-wheels
          path: dist/*.whl
  publish:
    if: inputs.publish
    needs: qualify-distribution
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: qualified-pypi-wheels
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
