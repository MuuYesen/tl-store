name: Release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish qualified wheels to PyPI (requires configured trusted publisher)
        required: true
        default: false
        type: boolean
      corresponding_source_url:
        description: Approved recipient-accessible corresponding-source offer for this exact version
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: tl-store-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    uses: ./.github/workflows/ci.yml
  qualify-distribution:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ctrader-cp313-*-release
          path: incoming
      - name: Select exact two platform wheels; keep private source artifacts private
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          wheels = sorted(Path('incoming').rglob('*.whl'))
          assert len(wheels) == 2, wheels
          assert len({p.name for p in wheels}) == 2
          Path('dist').mkdir()
          for path in wheels:
              assert path.name.startswith('tl_store-0.2.1a3-cp313-cp313-'), path
              shutil.copy2(path, Path('dist') / path.name)
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install twine
      - run: python -m twine check dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: qualified-pypi-wheels
          path: dist/*.whl
  publish:
    if: inputs.publish
    needs: qualify-distribution
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Require exact corresponding-source distribution decision
        env:
          SOURCE_URL: ${{ inputs.corresponding_source_url }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlsplit
          url = urlsplit(os.environ['SOURCE_URL'])
          assert url.scheme == 'https' and url.netloc and not url.username and not url.password, 'An approved corresponding-source offer is required; a private repository alone is not a recipient offer'
          PY
      - uses: actions/download-artifact@v4
        with:
          name: qualified-pypi-wheels
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
