name: Release build and offline tests
on: [push, pull_request, workflow_dispatch, workflow_call]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  wheels:
    name: ${{ matrix.slug }} CPython${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, slug: macos-arm64, python: '3.13', runtime: true, rebuild: true}
          - {os: macos-15, slug: macos-arm64, python: '3.14', runtime: true, rebuild: false}
          - {os: ubuntu-22.04, slug: linux-x86_64, python: '3.13', runtime: true, rebuild: true}
          - {os: ubuntu-22.04, slug: linux-x86_64, python: '3.14', runtime: true, rebuild: false}
          - {os: ubuntu-24.04-arm, slug: linux-aarch64, python: '3.13', runtime: false, rebuild: false, image: 'python:3.13.17-slim-bookworm@sha256:608b27b2db85abf38d81685085cd1166a5ed7ada66549f0dfe53a75bb830cd5d'}
          - {os: ubuntu-24.04-arm, slug: linux-aarch64, python: '3.14', runtime: false, rebuild: false, image: 'python:3.14-slim-bookworm@sha256:735903d501abec9d901059dd4ddd52982b0baf881ff7335a803c65c39ff5f4a4'}
          - {os: windows-latest, slug: windows-amd64, python: '3.13', runtime: false, rebuild: false}
          - {os: windows-latest, slug: windows-amd64, python: '3.14', runtime: false, rebuild: false}
    env:
      CARGO_BUILD_JOBS: '2'
      PYTHONUTF8: '1'
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Neutral Cargo source cache on the assigned runner
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          cache=Path(os.environ['RUNNER_TEMP'])/'cargo'
          cache.mkdir(exist_ok=True)
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as output:
              output.write('CARGO_HOME='+str(cache)+'\n')
          PY
      - uses: dtolnay/rust-toolchain@master
        if: matrix.slug != 'linux-aarch64'
        with:
          toolchain: '1.97.0'
      - name: Build tooling
        if: matrix.slug != 'linux-aarch64'
        run: python -m pip install 'maturin==1.13.1'
      - name: Audited source and license closure
        run: python tools/check_release.py
      - name: Optimized native wheel with corresponding source
        if: matrix.slug != 'linux-aarch64'
        run: |
          python tools/build_release.py --out raw-dist
          cargo vendor --locked --versioned-dirs --manifest-path adapters/ctrader/native/Cargo.toml "$RUNNER_TEMP/recipient-vendor"
          python tools/finalize_wheel.py raw-dist/*.whl dist/$(basename raw-dist/*.whl) --vendor-dir "$RUNNER_TEMP/recipient-vendor"
          python tools/check_release.py --wheel dist/*.whl
      - name: Native ARM64 build in exact official Bookworm compiler base
        if: matrix.slug == 'linux-aarch64'
        env:
          ARM_IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -i --platform linux/arm64 --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/source" -w /source -e CARGO_BUILD_JOBS=2 -e PYTHONUTF8=1 -e TL_HOST_UID="$(id -u)" -e TL_HOST_GID="$(id -g)" -e TL_BUILD_IMAGE="$ARM_IMAGE" "$ARM_IMAGE" sh -s <<'BUILD'
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake curl pkg-config ca-certificates git
          git config --global --add safe.directory /source
          curl --fail --location https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --profile minimal --default-toolchain 1.97.0
          export PATH="/root/.cargo/bin:$PATH"
          python -m pip install 'maturin==1.13.1'
          python tools/check_release.py
          python tools/build_release.py --out raw-dist
          cargo vendor --locked --versioned-dirs --manifest-path adapters/ctrader/native/Cargo.toml /tmp/recipient-vendor
          python tools/finalize_wheel.py raw-dist/*.whl dist/$(basename raw-dist/*.whl) --vendor-dir /tmp/recipient-vendor
          python tools/check_release.py --wheel dist/*.whl
          python - <<'PY'
          import json,os,platform,subprocess,sys
          from pathlib import Path
          record={'image':os.environ['TL_BUILD_IMAGE'],'OS':platform.system(),'machine':platform.machine(),'python':sys.version,'rustc':subprocess.check_output(['rustc','--version'],text=True).strip()}
          Path('dist/native-build-environment.json').write_text(json.dumps(record,indent=2)+'\n',encoding='utf-8')
          PY
          chown -R "$TL_HOST_UID:$TL_HOST_GID" dist raw-dist
          BUILD
      - name: Focused installed runtime; other targets remain build-only
        id: runtime
        if: matrix.runtime
        run: |
          python -m pip install 'pytest>=9,<10' 'nautilus_trader==2.0.0rc7'
          python -m pip install --no-deps --no-index --find-links dist 'tl-store==0.2.1a8'
          python -m pip check
          python -m pytest -q adapters/ctrader/tests --ignore=adapters/ctrader/tests/test_store.py
          cargo test --offline --locked --manifest-path adapters/ctrader/native/Cargo.toml --lib clock::qpc_tests
          cargo test --offline --locked --manifest-path adapters/ctrader/native/Cargo.toml --lib readonly_
          cargo test --offline --locked --manifest-path adapters/ctrader/native/Cargo.toml --lib one_owner_lock_survives_state_rename_and_follower_never_refreshes
          cargo test --offline --locked --manifest-path adapters/ctrader/native/Cargo.toml --lib observer_epoch_health_never_reconnects_and_rejects_changed_revision
      - name: Recipient source actual offline rebuild with empty Cargo home
        if: matrix.rebuild
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess,sys
          from pathlib import Path
          workspace=Path.cwd();temporary=Path(os.environ['RUNNER_TEMP'])
          wheel=next((workspace/'dist').glob('*.whl'));source=temporary/'recipient-rebuild-source'
          subprocess.run([sys.executable,'tools/finalize_wheel.py','--extract-corresponding-source',str(wheel),'--destination',str(source)],check=True)
          env=dict(os.environ,CARGO_HOME=str(temporary/'recipient-empty-cargo'),CARGO_TARGET_DIR=str(temporary/'recipient-target'),CARGO_NET_OFFLINE='true')
          output=temporary/'recipient-rebuilt-wheels'
          subprocess.run([sys.executable,'tools/build_release.py','--offline','--vendor-dir',str(source/'vendor'),'--out',str(output)],cwd=source,env=env,check=True)
          rebuilt=next(output.glob('*.whl'));installed=temporary/'recipient-rebuilt-installed'
          subprocess.run([sys.executable,'-m','pip','install','--no-index','--no-deps','--no-compile','--target',str(installed),str(rebuilt)],check=True)
          probe="import hashlib,json;from pathlib import Path;import tl_store.ctrader._native as n;import tl_store.ctrader.factories;assert str(Path(n.__file__)).startswith("+repr(str(installed))+");print(json.dumps({'native':str(Path(n.__file__).relative_to("+repr(str(installed))+")),'native_sha256':hashlib.sha256(Path(n.__file__).read_bytes()).hexdigest()}))"
          result=subprocess.check_output([sys.executable,'-c',probe],cwd=temporary,env=dict(os.environ,PYTHONPATH=str(installed)),text=True)
          receipt={'recipient_native':json.loads(result.strip().splitlines()[-1]),'wheel_sha256':hashlib.sha256(wheel.read_bytes()).hexdigest(),'rebuilt_wheel_sha256':hashlib.sha256(rebuilt.read_bytes()).hexdigest(),'empty_Cargo_home':True,'offline':True,'source_manifest_sha256':hashlib.sha256((source/'SOURCE-MANIFEST.json').read_bytes()).hexdigest(),'rustc':subprocess.check_output(['rustc','--version'],text=True).strip()}
          (workspace/'dist/recipient-rebuild.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
      - name: Record real build and test boundaries
        env:
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
          SLUG: ${{ matrix.slug }}
        run: |
          python - <<'PY'
          import hashlib,json,os,platform,sys,zipfile
          from pathlib import Path
          wheel=next(Path('dist').glob('*.whl'))
          with zipfile.ZipFile(wheel) as archive:
              native=next(n for n in archive.namelist() if n.startswith('tl_store/ctrader/_native.') and n.endswith(('.so','.pyd')))
              native_sha=hashlib.sha256(archive.read(native)).hexdigest()
          environment=Path('dist/native-build-environment.json')
          built=json.loads(environment.read_text(encoding='utf-8')) if environment.exists() else {'OS':platform.system(),'machine':platform.machine(),'python':sys.version}
          status=os.environ['RUNTIME_OUTCOME'];assert status in ('success','skipped'),status
          receipt={'source_sha':os.environ['GITHUB_SHA'],'wheel':wheel.name,'wheel_sha256':hashlib.sha256(wheel.read_bytes()).hexdigest(),'native':native,'native_sha256':native_sha,'OS':built['OS'],'machine':built['machine'],'python':built['python'],'build_environment':built,'runtime_tested':status=='success','qualification':'installed-runtime-tested' if status=='success' else 'build-only/not-runtime-tested','target':os.environ['SLUG']}
          Path('dist/platform-qualification.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostic-${{ matrix.python }}-${{ matrix.slug }}
          path: raw-dist/*.whl
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: ctrader-${{ matrix.python }}-${{ matrix.slug }}-release
          path: dist/*
          if-no-files-found: error
