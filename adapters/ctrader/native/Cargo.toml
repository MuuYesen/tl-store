[package]
name = "tl-store-ctrader-native"
version = "0.2.1"
edition = "2024"
license = "LGPL-3.0-only"
repository = "https://github.com/MuuYesen/TL-Store"
[workspace]
[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]
[features]
python = ["dep:pyo3", "dep:pyo3-async-runtimes"]
extension-module = ["python", "pyo3/extension-module"]
[dependencies]
anyhow = "1.0.104"
futures-util = { version = "0.3.34", features = ["sink"] }
libc = "0.2"
log = "0.4"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls"] }
rust_decimal = { version = "1.43.0", features = ["serde-with-str"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
time = { version = "0.3.55", features = ["macros", "parsing", "formatting"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "sync", "fs", "io-util", "net", "time", "macros"] }
tokio-rustls = "0.26.6"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
webpki-roots = "1.0.9"
pyo3 = { version = "0.29.3", optional = true, features = ["macros"] }
pyo3-async-runtimes = { version = "0.29.0", optional = true, features = ["tokio-runtime"] }
[dev-dependencies]
rstest = "0.27.0"
[profile.dev]
debug = 0
incremental = false
[profile.test]
debug = 0
incremental = false

[profile.release]
opt-level = 3
debug = 0
incremental = false
